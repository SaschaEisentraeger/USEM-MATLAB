name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  matlab-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest

      - name: Run test suite
        uses: matlab-actions/run-command@v2
        with:
          command: cd tests; run_tests('Coverage', true)

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/results/
